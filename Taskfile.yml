version: '3'

vars:
  APP_NAME: penguinspace
  BIN_DIR: out
  PACKAGE_MANAGER: bun
  GOOS: '{{.GOOS | default "windows"}}'
  GOARCH: '{{.GOARCH | default "amd64"}}'

tasks:
  install:frontend:
    dir: frontend
    cmds:
      - bun install --frozen-lockfile

  generate:bindings:
    cmds:
      - GOOS=windows CGO_ENABLED=0 wails3 generate bindings -clean=true -ts -i

  build:frontend:
    deps: [install:frontend, generate:bindings]
    dir: frontend
    cmds:
      - bun run build

  build:
    deps: [build:frontend]
    cmds:
      - |
        set -eu
        : "${VERSION:?VERSION is required (for example, VERSION=0.1.0 task build)}"
        case "$VERSION" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "VERSION must be a semantic version without a leading v (for example, 0.1.0): $VERSION" >&2; exit 1 ;;
        esac
        artifact="{{.BIN_DIR}}/{{.APP_NAME}}-v${VERSION}.exe"
        if [ -e "$artifact" ]; then
          echo "Refusing to overwrite existing artifact: $artifact" >&2
          exit 1
        fi
        mkdir -p "{{.BIN_DIR}}"
        GOOS={{.GOOS}} GOARCH={{.GOARCH}} CGO_ENABLED=0 go build -tags production -trimpath -buildvcs=false -ldflags='-w -s -H windowsgui' -o "$artifact" .
        printf 'Built Windows artifact: %s\n' "$artifact"
